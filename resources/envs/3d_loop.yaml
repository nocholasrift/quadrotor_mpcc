templates:
  - &square
    type: "box"
    size: [8.0, 8.0, 15.0] 

  - &pillar
    type: "box"
    size: [1.0, 1.0, 15.0] 


obstacles:
  # 1. THE INNER PINCH (Near Gate 1: [6, 0, 1.2])
  # Placed at R=4.5 to force the drone to stay on the outside of the turn.
  - <<: *square
    position: [0.0, 0.0, 0.0]
    rotation: [0, 0, 0]

  - <<: *pillar
    position: [3.2, 6.0, 0.0]
    rotation: [0, 0, 0]

  - <<: *pillar
    position: [-4.8, 5.7, 0.0]
    rotation: [0, 0, 0]

  - <<: *pillar
    position: [-6.0, 4.0, 0.0]
    rotation: [0, 0, 0]

  - <<: *pillar
    position: [-2.0, -6.5, 0.0]
    rotation: [0, 0, 0]

